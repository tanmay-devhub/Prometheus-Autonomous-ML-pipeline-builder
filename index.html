<style>
/* ── Prometheus global styles ── */
html, body, #root { height: 100%; }
body {
  background: radial-gradient(1200px 700px at 20% -10%, rgba(59,130,246,.08), transparent 60%),
              radial-gradient(900px 600px at 100% 100%, rgba(16,185,129,.06), transparent 60%),
              #0A0E1A;
  background-attachment: fixed;
}
.bg-grid {
  background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 48px 48px; background-position: center;
}
.bg-grid-fine {
  background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 24px 24px;
}
@keyframes pulseRing {
  0%   { box-shadow: 0 0 0 0   rgba(59,130,246,.6), 0 0 0 0 rgba(59,130,246,.3); }
  70%  { box-shadow: 0 0 0 8px rgba(59,130,246,0),  0 0 0 16px rgba(59,130,246,0); }
  100% { box-shadow: 0 0 0 0   rgba(59,130,246,0),  0 0 0 0 rgba(59,130,246,0); }
}
.pulse-ring { animation: pulseRing 1.8s ease-out infinite; }
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .55; transform: scale(.85); }
}
.pulse-dot { animation: pulseDot 1.4s ease-in-out infinite; }
@keyframes liquidPour {
  0%   { transform: scaleX(0); transform-origin: left; }
  100% { transform: scaleX(1); transform-origin: left; }
}
.liquid-pour { animation: liquidPour .9s cubic-bezier(.65,.05,.36,1) forwards; }
@keyframes spin360 { to { transform: rotate(360deg); } }
.spin-slow { animation: spin360 2.4s linear infinite; }
@keyframes shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position:  200% 0; }
}
.shimmer {
  background: linear-gradient(90deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,.10) 50%, rgba(255,255,255,.03) 100%);
  background-size: 200% 100%; animation: shimmer 1.8s ease-in-out infinite;
}
@keyframes waterfallUp {
  0%   { transform: translateY(100%); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(-120%); opacity: 0; }
}
.waterfall-row {
  position: absolute; left: 0; right: 0;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: rgba(96,165,250,.8); white-space: nowrap;
  animation: waterfallUp linear infinite;
}
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
.blink { animation: blink 1s steps(1) infinite; }
.card-lift { transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease; }
.card-lift:hover { transform: translateY(-2px); }
.glass {
  background: linear-gradient(180deg, rgba(20,26,42,.7) 0%, rgba(15,20,33,.85) 100%);
  border: 1px solid rgba(148,163,184,.10); backdrop-filter: blur(8px);
}
.glass-strong {
  background: linear-gradient(180deg, rgba(26,34,53,.85) 0%, rgba(15,20,33,.92) 100%);
  border: 1px solid rgba(148,163,184,.12);
}
.dropzone { border: 1.5px dashed rgba(148,163,184,.25); transition: border-color .25s ease, background-color .25s ease, transform .25s ease; }
.dropzone.dragging { border-color: rgba(59,130,246,.7); background-color: rgba(59,130,246,.06); transform: scale(1.01); }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.confetti { position: absolute; width: 8px; height: 8px; pointer-events: none; }
.tok-kw  { color: #C792EA; } .tok-fn  { color: #82AAFF; } .tok-str { color: #C3E88D; }
.tok-num { color: #F78C6C; } .tok-cmt { color: #546E7A; font-style: italic; }
.tok-var { color: #EEFFFF; } .tok-pun { color: #89DDFF; }
.gauge-track { stroke: rgba(148,163,184,.15); }
.gauge-fill  { stroke: url(#gaugeGrad); filter: drop-shadow(0 0 8px rgba(59,130,246,.4)); }
input:focus, textarea:focus, button:focus { outline: none; }
input:focus-visible, textarea:focus-visible { box-shadow: 0 0 0 2px rgba(59,130,246,.5); }
::selection { background: rgba(59,130,246,.4); color: white; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(148,163,184,.18); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.32); background-clip: content-box; border: 2px solid transparent; }
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: rgba(133,147,173,.85); }
.dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; }
</style>

<script type="text/babel">
// ── tweaks-panel ──────────────────────────────────────────────────────────────
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;box-sizing:border-box;width:100%;min-width:0;height:26px;padding:0 8px;border:.5px solid rgba(0,0,0,.1);border-radius:7px;background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  select.twk-field{padding-right:22px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel">
        <div className="twk-hd"><b>{title}</b><button className="twk-x" onClick={() => setOpen(false)}>✕</button></div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}
function TweakSection({ label, children }) { return <><div className="twk-sect">{label}</div>{children}</>; }
function TweakRow({ label, children }) { return <div className="twk-row"><div className="twk-lbl"><span>{label}</span></div>{children}</div>; }
function TweakToggle({ label, value, onChange }) {
  return <div className="twk-row twk-row-h"><div className="twk-lbl"><span>{label}</span></div><button type="button" className="twk-toggle" data-on={value ? '1' : '0'} onClick={() => onChange(!value)}><i/></button></div>;
}
function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  return (
    <TweakRow label={label}>
      <div role="radiogroup" className="twk-seg">
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }}/>
        {opts.map(o => <button key={o.value} type="button" onClick={() => onChange(o.value)}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}
function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={e => onChange(e.target.value)}>
        {options.map(o => { const v = typeof o === 'object' ? o.value : o; const l = typeof o === 'object' ? o.label : o; return <option key={v} value={v}>{l}</option>; })}
      </select>
    </TweakRow>
  );
}
</script>

<script type="text/babel">
// ── shared components ─────────────────────────────────────────────────────────
const { motion, AnimatePresence, animate } = window.framerMotion || window.Motion || {};
const { useState, useEffect, useRef, useMemo, useLayoutEffect } = React;

const STAGES = [
  { id: 'analyze',    label: 'Analyze' },
  { id: 'profile',    label: 'Profile' },
  { id: 'approve',    label: 'Approve' },
  { id: 'experiment', label: 'Experiment' },
  { id: 'select',     label: 'Select Model' },
  { id: 'generate',   label: 'Generate Output' },
  { id: 'complete',   label: 'Complete' },
];
const VIEW_TO_STAGE = { upload:-1, approval:2, profile:1, experiment:3, select:4, complete:6, failed:3 };

function CountUp({ to, duration = 1.2, decimals = 3, prefix = '', suffix = '', className = '' }) {
  const [val, setVal] = useState(0);
  const fromRef = useRef(0);
  useEffect(() => {
    const start = performance.now();
    const from = fromRef.current;
    let raf;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / (duration * 1000));
      const eased = 1 - Math.pow(1 - t, 3);
      setVal(from + (to - from) * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
      else fromRef.current = to;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [to, duration]);
  return <span className={className}>{prefix}{val.toFixed(decimals)}{suffix}</span>;
}

function PollingIndicator({ active = true, label = 'polling' }) {
  return (
    <div className="flex items-center gap-2 text-ink-400">
      <svg width="14" height="14" viewBox="0 0 24 24" className={active ? 'spin-slow' : ''}>
        <circle cx="12" cy="12" r="9" stroke="rgba(148,163,184,.2)" strokeWidth="2" fill="none"/>
        <path d="M12 3 a 9 9 0 0 1 9 9" stroke="#3B82F6" strokeWidth="2" strokeLinecap="round" fill="none"/>
      </svg>
      <span className="eyebrow text-[10px]">{label} · 3s</span>
    </div>
  );
}

function PipelineProgressBar({ activeIndex }) {
  return (
    <div className="w-full px-8 pt-6 pb-5">
      <div className="flex items-center w-full max-w-[1280px] mx-auto">
        {STAGES.map((s, i) => {
          const done = i < activeIndex, active = i === activeIndex, segDone = i < activeIndex;
          return (
            <React.Fragment key={s.id}>
              <div className="flex flex-col items-center relative" style={{ minWidth: 0 }}>
                <div className="relative">
                  <div className={['w-9 h-9 rounded-full flex items-center justify-center transition-colors duration-300',
                    done   && 'bg-accent-emerald/15 border border-accent-emerald/60',
                    active && 'bg-accent-blue/15 border border-accent-blue/70 pulse-ring',
                    !done && !active && 'bg-ink-850 border border-ink-700',
                  ].filter(Boolean).join(' ')}>
                    {done ? (
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12.5 L10 17 L19 7" stroke="#10B981" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                    ) : active ? (
                      <span className="w-2 h-2 rounded-full bg-accent-blue pulse-dot"/>
                    ) : (
                      <span className="w-1.5 h-1.5 rounded-full bg-ink-600"/>
                    )}
                  </div>
                </div>
                <div className={['mt-2 text-[11px] font-medium whitespace-nowrap',
                  done    && 'text-accent-emerald',
                  active  && 'text-ink-100',
                  !done && !active && 'text-ink-500',
                ].filter(Boolean).join(' ')}>
                  <span className="font-mono text-ink-500 mr-1.5">{String(i+1).padStart(2,'0')}</span>
                  {s.label}
                </div>
              </div>
              {i < STAGES.length - 1 && (
                <div className="flex-1 h-px relative mx-2 mb-5">
                  <div className="absolute inset-0 bg-ink-700"/>
                  {segDone && (
                    <div key={`seg-${i}-${activeIndex}`} className="absolute inset-0 liquid-pour"
                      style={{ background:'linear-gradient(90deg, rgba(16,185,129,.9) 0%, rgba(59,130,246,.9) 100%)', boxShadow:'0 0 8px rgba(59,130,246,.5)' }}/>
                  )}
                </div>
              )}
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

function TopBar({ jobId, polling }) {
  return (
    <div className="flex items-center justify-between px-8 pt-5 pb-2">
      <div className="flex items-center gap-3">
        <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-accent-blue to-accent-violet flex items-center justify-center shadow-glow-blue">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 2 L4 7 L4 17 L12 22 L20 17 L20 7 Z" stroke="white" strokeWidth="1.5" fill="none"/>
            <path d="M12 2 L12 22 M4 7 L20 17 M20 7 L4 17" stroke="white" strokeWidth="1" opacity=".6"/>
          </svg>
        </div>
        <div>
          <div className="text-[13px] font-semibold tracking-tight">Prometheus</div>
          <div className="eyebrow text-[9.5px] -mt-px">autonomous ml pipeline</div>
        </div>
        {jobId && (
          <div className="ml-6 pl-6 border-l border-ink-700/60">
            <div className="eyebrow text-[9.5px]">job</div>
            <div className="font-mono text-[12px] text-ink-200">{jobId}</div>
          </div>
        )}
      </div>
      <div className="flex items-center gap-5">
        <PollingIndicator active={polling}/>
        <div className="flex items-center gap-2 px-3 py-1.5 rounded-md bg-ink-800/60 border border-ink-700/60">
          <span className="w-7 h-7 rounded-full bg-gradient-to-br from-accent-emerald to-accent-blue"/>
          <span className="text-[12px] text-ink-200">alex@lab.io</span>
        </div>
      </div>
    </div>
  );
}

function TerminalLog({ lines, running, accent = 'blue', height = 220 }) {
  const scrollerRef = useRef(null);
  useLayoutEffect(() => { const el = scrollerRef.current; if (el) el.scrollTop = el.scrollHeight; }, [lines]);
  const dotColor = accent === 'emerald' ? 'bg-accent-emerald' : 'bg-accent-blue';
  return (
    <div className="rounded-lg bg-[#070A12] border border-ink-700/70 overflow-hidden">
      <div className="flex items-center justify-between px-3 py-2 bg-ink-850/80 border-b border-ink-700/50">
        <div className="flex items-center gap-1.5">
          <span className="w-2.5 h-2.5 rounded-full bg-[#FF5F57]/70"/>
          <span className="w-2.5 h-2.5 rounded-full bg-[#FEBC2E]/70"/>
          <span className="w-2.5 h-2.5 rounded-full bg-[#28C840]/70"/>
        </div>
        <div className="font-mono text-[10px] text-ink-500 tracking-wide">train.log · tail -f</div>
        <span className={`dot ${dotColor} ${running ? 'pulse-dot' : ''}`}/>
      </div>
      <div ref={scrollerRef} className="px-3 py-2 font-mono text-[11.5px] leading-relaxed no-scrollbar overflow-y-auto" style={{ height }}>
        {lines.map((l, i) => (
          <div key={i} className="flex gap-2">
            <span className="text-ink-600 select-none w-7 text-right shrink-0">{String(i+1).padStart(3,'0')}</span>
            <span className="text-ink-600 select-none">›</span>
            <span className={l.kind==='err'?'text-accent-rose':l.kind==='ok'?'text-accent-emerald':l.kind==='warn'?'text-accent-amber':l.kind==='info'?'text-ink-300':'text-ink-400'}>{l.text}</span>
          </div>
        ))}
        {running && (
          <div className="flex gap-2">
            <span className="text-ink-600 select-none w-7 text-right shrink-0">{String(lines.length+1).padStart(3,'0')}</span>
            <span className="text-ink-600 select-none">›</span>
            <span className="text-ink-300"><span className="blink inline-block w-2 h-3.5 bg-accent-blue align-middle ml-0.5"/></span>
          </div>
        )}
      </div>
    </div>
  );
}

function CircularProgress({ value, total = 3, size = 44, stroke = 4, color = '#3B82F6', label }) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, value / total)), dash = c * pct;
  return (
    <div className="relative inline-flex items-center justify-center" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size/2} cy={size/2} r={r} stroke="rgba(148,163,184,.18)" strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none" strokeLinecap="round"
          strokeDasharray={`${dash} ${c}`} style={{ transition:'stroke-dasharray .6s cubic-bezier(.4,0,.2,1)' }}/>
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <div className="font-mono text-[11px] font-semibold text-ink-100 leading-none">{value}<span className="text-ink-500">/{total}</span></div>
        {label && <div className="eyebrow text-[8px] leading-none mt-0.5">{label}</div>}
      </div>
    </div>
  );
}

function StatusBadge({ status }) {

function Confetti({ trigger }) {
  const [pieces, setPieces] = useState([]);
  useEffect(() => {
    if (!trigger) return;
    const colors = ['#3B82F6','#10B981','#FBBF24','#8B5CF6','#F43F5E'];
    const p = Array.from({ length: 60 }).map((_, i) => ({
      id: i + Math.random(), x: 50 + (Math.random()-.5)*20, y: 50,
      dx: (Math.random()-.5)*600, dy: -200 - Math.random()*300,
      rot: Math.random()*720-360, color: colors[i%colors.length],
      shape: Math.random()>.5?'rect':'circle', delay: Math.random()*0.15,
    }));
    setPieces(p);
    const t = setTimeout(() => setPieces([]), 2200);
    return () => clearTimeout(t);
  }, [trigger]);
  if (!pieces.length) return null;
  return (
    <div className="absolute inset-0 pointer-events-none overflow-hidden">
      {pieces.map(p => (
        <motion.div key={p.id} className="confetti"
          initial={{ x:0, y:0, rotate:0, opacity:1 }}
          animate={{ x:p.dx, y:p.dy+400, rotate:p.rot, opacity:0 }}
          transition={{ duration:1.6, delay:p.delay, ease:[.2,.7,.3,1] }}
          style={{ left:`${p.x}%`, top:`${p.y}%`, background:p.color, borderRadius:p.shape==='circle'?'50%':'2px' }}/>
      ))}
    </div>
  );
}

function NetworkGraph() {
  const nodes = useMemo(() => {
    const arr = [], layers = [3,5,7,5,3]; let idx=0;
    layers.forEach((n,li) => { for(let i=0;i<n;i++){arr.push({id:`${li}-${i}`,x:80+li*110,y:60+(i+1)*(300/(n+1)),layer:li,delay:idx*.06});idx++;} });
    return arr;
  }, []);
  const edges = useMemo(() => {
    const e=[], byLayer={};
    nodes.forEach(n=>{(byLayer[n.layer]||=[]).push(n);});
    Object.keys(byLayer).forEach(li=>{const next=byLayer[+li+1];if(!next)return;byLayer[li].forEach(a=>next.forEach(b=>{if(Math.random()<.55)e.push({a,b,delay:Math.max(a.delay,b.delay)+.1});}));});
    return e;
  }, [nodes]);
  return (
    <svg viewBox="0 0 600 360" className="w-full h-full">
      <defs><radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stopColor="#3B82F6" stopOpacity=".9"/><stop offset="100%" stopColor="#3B82F6" stopOpacity="0"/></radialGradient></defs>
      {edges.map((e,i)=>(
        <M.line key={i} x1={e.a.x} y1={e.a.y} x2={e.b.x} y2={e.b.y}
          stroke="rgba(96,165,250,.35)" strokeWidth=".75"
          initial={{pathLength:0,opacity:0}} animate={{pathLength:1,opacity:1}}
          transition={{duration:.8,delay:e.delay,ease:'easeInOut'}}/>
      ))}
      {nodes.map(n=>(
        <M.g key={n.id} initial={{opacity:0,scale:0}} animate={{opacity:1,scale:1}} transition={{duration:.45,delay:n.delay,ease:'backOut'}}>
          <circle cx={n.x} cy={n.y} r="14" fill="url(#nodeGlow)"/>
          <circle cx={n.x} cy={n.y} r="4.5" fill="#60A5FA"/>
          <circle cx={n.x} cy={n.y} r="2" fill="white"/>
        </M.g>
      ))}
    </svg>
  );
}

function useStreamingLog(allLines, intervalMs=700, running=true) {
  const [count, setCount] = useState(1);
  useEffect(() => {
    if (!running || count >= allLines.length) return;
    const t = setTimeout(()=>setCount(c=>Math.min(allLines.length,c+1)), intervalMs);
    return ()=>clearTimeout(t);
  }, [count, allLines.length, running, intervalMs]);
  return allLines.slice(0, count);
}

function LiveTimer() {
  const [s, setS] = useState(0);
  useEffect(()=>{ const t=setInterval(()=>setS(v=>v+1),1000); return()=>clearInterval(t); },[]);
  return <span>{String(Math.floor(s/60)).padStart(2,'0')}:{String(s%60).padStart(2,'0')}</span>;
}

function Sparkline({ data, color, label }) {
  const w=140, h=36, max=Math.max(...data), min=Math.min(...data);
  const pts = data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/(max-min||1))*h}`).join(' ');
  return (
    <div className="flex items-center gap-3">
      <span className="font-mono text-[11px] text-ink-400">{label}</span>
      <svg width={w} height={h}>
        <polyline points={pts} stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        {data.map((v,i)=>{ const x=(i/(data.length-1))*w, y=h-((v-min)/(max-min||1))*h; return <circle key={i} cx={x} cy={y} r="1.5" fill={color}/>; })}
      </svg>
      <span className="font-mono text-[11px]" style={{color}}>{data[data.length-1].toFixed(3)}</span>
    </div>
  );
}

function ExperimentRaceView({ phase='racing' }) {
  const linesA = useStreamingLog(LOG_LINES_A, 700, phase==='racing');

  const lastB = linesB[linesB.length-1];
  const statusB = phase==='finished'||linesB.length>=LOG_LINES_B.length?'success':lastB?.kind==='warn'?'retrying':'running';
  const retriesB = linesB.filter(l=>l.text.includes('autofix')).length;
  const completedA = phase==='finished'||linesA.length>=LOG_LINES_A.length;

function describeArc(cx,cy,r,startAngle,endAngle) {
  const polar=(cx,cy,r,deg)=>({x:cx+r*Math.cos(deg*Math.PI/180),y:cy+r*Math.sin(deg*Math.PI/180)});
  const start=polar(cx,cy,r,startAngle), end=polar(cx,cy,r,endAngle);
  return `M ${start.x} ${start.y} A ${r} ${r} 0 ${endAngle-startAngle<=180?0:1} 1 ${end.x} ${end.y}`;
}

function Gauge({ value, max=1 }) {
  const pct=value/max, r=70, cx=90, cy=90;
  const arcLen=270*Math.PI/180*r, filledLen=arcLen*pct;
  const angle=-135+pct*270;
  const polar=(cx,cy,r,deg)=>({x:cx+r*Math.cos(deg*Math.PI/180),y:cy+r*Math.sin(deg*Math.PI/180)});
  const np=polar(cx,cy,r-14,angle);
  return (
    <svg width="180" height="120" viewBox="0 0 180 130">
      <defs><linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stopColor="#3B82F6"/><stop offset="100%" stopColor="#10B981"/></linearGradient></defs>
      <path d={describeArc(cx,cy,r,-135,135)} className="gauge-track" strokeWidth="10" fill="none" strokeLinecap="round"/>
      <M2.path d={describeArc(cx,cy,r,-135,135)} className="gauge-fill" strokeWidth="10" fill="none" strokeLinecap="round"
        strokeDasharray={`${filledLen} ${arcLen}`} initial={{strokeDasharray:`0 ${arcLen}`}} animate={{strokeDasharray:`${filledLen} ${arcLen}`}} transition={{duration:1.3,ease:[.2,.7,.2,1]}}/>
      <M2.line x1={cx} y1={cy} x2={np.x} y2={np.y} stroke="#EEF1F7" strokeWidth="2" strokeLinecap="round" initial={{pathLength:0}} animate={{pathLength:1}} transition={{duration:.8,delay:.4}}/>
      <circle cx={cx} cy={cy} r="5" fill="#EEF1F7"/><circle cx={cx} cy={cy} r="2" fill="#0A0E1A"/>
      <text x={cx} y={cy+26} textAnchor="middle" fill="#EEF1F7" fontFamily="JetBrains Mono,monospace" fontWeight="600" fontSize="18">{value.toFixed(3)}</text>
    </svg>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const view = t.view;

  useEffect(()=>{
    if(!t.autoplay) return;
    const idx=VIEW_ORDER.indexOf(view);
    if(idx===-1||idx===VIEW_ORDER.length-1) return;
    const delays={upload:2200,approval:2800,profile:4500,experiment:6500,select:4500};
    const timer=setTimeout(()=>setTweak('view',VIEW_ORDER[idx+1]),delays[view]||3000);
    return()=>clearTimeout(timer);
  },[view,t.autoplay]);

  const goto = v => setTweak('view', v);
  const stageIndex = VIEW_TO_STAGE[view] ?? 0;
  const showChrome = view !== 'upload';

  return (
    <div className="h-full w-full flex flex-col relative">
      <div className="absolute inset-0 bg-grid opacity-50 pointer-events-none"/>

            {view==='approval'   && <ApprovalGate      onApprove={()=>goto('profile')} onReject={()=>goto('upload')}/>}
            {view==='profile'    && <DataProfileView/>}
            {view==='experiment' && <ExperimentRaceView phase={t.raceState}/>}
            {view==='select'     && <ModelSelectionView onApprove={()=>goto('complete')}/>}
            {view==='complete'   && <CompleteView/>}
            {view==='failed'     && <FailedView        onRestart={()=>goto('upload')}/>}
          </MA.div>
        </APA>
      </div>
      <ViewStepper current={view} onChange={goto}/>
      <TweaksPanel>
        <TweakSection label="Navigation"/>
        <TweakSelect label="View" value={t.view} options={[
          {label:'01 · Upload',value:'upload'},{label:'02 · Approval Gate',value:'approval'},
          {label:'03 · Profiling',value:'profile'},{label:'04 · Experiments ★',value:'experiment'},
          {label:'05 · Selection',value:'select'},{label:'06 · Complete',value:'complete'},
          {label:'!! · Failed state',value:'failed'},
        ]} onChange={v=>setTweak('view',v)}/>
        <TweakToggle label="Autoplay all views" value={t.autoplay} onChange={v=>setTweak('autoplay',v)}/>
        <TweakSection label="Experiments screen"/>
        <TweakRadio label="Race state" value={t.raceState} options={['racing','finished']} onChange={v=>setTweak('raceState',v)}/>
        <TweakSection label="Global"/>
        <TweakToggle label="Polling indicator" value={t.polling} onChange={v=>setTweak('polling',v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
